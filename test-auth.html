<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Store - Login</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .login-box{
            width:350px;
            margin:80px auto;
            background:white;
            padding:20px;
            border:1px solid #ccc;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            cursor:pointer;
        }

        .google-button{
            background:#ffffff;
            border:1px solid #ccc;
        }

        #result{
            margin-top:15px;
            color:red;
            text-align:center;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>My Store Login</h2>

    <input
            id="name"
            type="text"
            placeholder="Name"
    >

    <input
            id="email"
            type="email"
            placeholder="Email"
    >

    <input
            id="password"
            type="password"
            placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <button onclick="register()">
        Register
    </button>

    <button class="google-button" onclick="loginWithGoogle()">
        Login with Google
    </button>

    <div id="result"></div>

</div>

<script>

const API_URL="http://127.0.0.1:8000";


function loginWithGoogle(){

    window.location=`${API_URL}/auth/google/login`;

}


async function register(){

    const name=document.getElementById("name").value;

    const email=document.getElementById("email").value;

    const password=document.getElementById("password").value;

    const response=await fetch(`${API_URL}/auth/register`,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            name:name,
            email:email,
            password:password
        })

    });

    const data=await response.json();

    if(!response.ok){

        document.getElementById("result").style.color="red";

        document.getElementById("result").innerHTML=data.detail;

        return;
    }

    document.getElementById("result").style.color="green";

    document.getElementById("result").innerHTML="Account created. You can login now.";

}


async function login(){

    const email=document.getElementById("email").value;

    const password=document.getElementById("password").value;

    const formData=new URLSearchParams();

    formData.append("username",email);
    formData.append("password",password);

    const response=await fetch(`${API_URL}/auth/login`,{

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:formData

    });

    const data=await response.json();

    if(!response.ok){

        document.getElementById("result").style.color="red";

        document.getElementById("result").innerHTML=data.detail;

        return;
    }

    localStorage.setItem("token",data.access_token);

    const meResponse=await fetch(`${API_URL}/auth/me`,{

        headers:{
            "Authorization":"Bearer "+data.access_token
        }

    });

    const me=await meResponse.json();

    if(me.role==="ADMIN"){

        window.location="admin.html";

    }else{

        window.location="products.html?view=store";

    }

}

</script>

</body>
</html>
