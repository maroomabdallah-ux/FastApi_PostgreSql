<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .container{
            width:1000px;
            max-width:calc(100% - 30px);
            margin:auto;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
        }

        .actions{
            display:flex;
            gap:10px;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
            gap:15px;
            margin-top:15px;
        }

        .card{
            background:white;
            padding:15px;
            border:1px solid #ccc;
        }

        .card h3{
            margin-top:0;
        }

        .price{
            font-weight:bold;
        }

        button{
            padding:10px;
            cursor:pointer;
        }

        .card button{
            width:100%;
            margin-top:10px;
        }

        #message{
            margin-top:15px;
            color:green;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h2 id="pageTitle">Products</h2>

        <div class="actions">

            <button onclick="loadStoreProducts()">
                Store
            </button>

            <button onclick="loadMyProducts()">
                My Products
            </button>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>

    <hr>

    <div id="message"></div>

    <div id="products" class="grid"></div>

</div>

<script>

const API_URL="http://127.0.0.1:8000";

const hashParams=new URLSearchParams(window.location.hash.substring(1));
const googleToken=hashParams.get("token");

if(googleToken){

    localStorage.setItem("token",googleToken);
    window.history.replaceState(null,"",window.location.pathname + window.location.search);

}

const token=localStorage.getItem("token");

if(!token){

    window.location="test-auth.html";

}


function authHeaders(extraHeaders={}){

    return {
        "Authorization":"Bearer "+token,
        ...extraHeaders
    };

}


function showMessage(message,color="green"){

    const div=document.getElementById("message");

    div.style.color=color;

    div.innerHTML=message;

}


async function loadStoreProducts(){

    document.getElementById("pageTitle").innerHTML="Store Products";

    showMessage("");

    const response=await fetch(`${API_URL}/products/store`,{

        headers:authHeaders()

    });

    const products=await response.json();

    const div=document.getElementById("products");

    div.innerHTML="";

    if(!response.ok){

        showMessage(products.detail || "Could not load products","red");

        return;

    }

    if(products.length===0){

        div.innerHTML="<p>No products available.</p>";

        return;

    }

    products.forEach(product=>{

        div.innerHTML+=`

        <div class="card">

            <h3>${product.name}</h3>

            <p>${product.description}</p>

            <p class="price">$${product.price}</p>

            <p>Stock: ${product.stock_quantity}</p>

            <button onclick="addToMyProducts(${product.id})">
                Add
            </button>

        </div>

        `;

    });

}


async function addToMyProducts(productId){

    const response=await fetch(`${API_URL}/user-products/my`,{

        method:"POST",

        headers:authHeaders({
            "Content-Type":"application/json"
        }),

        body:JSON.stringify({
            product_id:productId,
            quantity:1
        })

    });

    const data=await response.json();

    if(!response.ok){

        showMessage(data.detail || "Could not add product","red");

        return;

    }

    showMessage(`${data.name} added to your products.`);
    loadStoreProducts();

}


async function loadMyProducts(){

    document.getElementById("pageTitle").innerHTML="My Products";

    showMessage("");

    const response=await fetch(`${API_URL}/user-products/my`,{

        headers:authHeaders()

    });

    const products=await response.json();

    const div=document.getElementById("products");

    div.innerHTML="";

    if(!response.ok){

        showMessage(products.detail || "Could not load your products","red");

        return;

    }

    if(products.length===0){

        div.innerHTML="<p>You have not added products yet.</p>";

        return;

    }

    products.forEach(product=>{

        div.innerHTML+=`

        <div class="card">

            <h3>${product.name}</h3>

            <p>${product.description}</p>

            <p class="price">$${product.price}</p>

            <p>Quantity: ${product.quantity}</p>

        </div>

        `;

    });

}


function logout(){

    localStorage.removeItem("token");

    window.location="test-auth.html";

}

const params=new URLSearchParams(window.location.search);

if(params.get("view")==="my"){

    loadMyProducts();

}else{

    loadStoreProducts();

}

</script>

</body>
</html>
