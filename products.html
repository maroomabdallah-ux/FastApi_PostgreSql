<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Products</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .container{
            width:800px;
            margin:auto;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .card{

            background:white;

            padding:15px;

            margin-top:15px;

            border:1px solid #ccc;

        }

        button{

            padding:10px;

            cursor:pointer;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h2>My Products</h2>

        <button onclick="logout()">
            Logout
        </button>

    </div>

    <hr>

    <div id="products">

    </div>

</div>

<script>

const API_URL="http://127.0.0.1:8000";

const token=localStorage.getItem("token");

if(!token){

    window.location="test-auth.html";

}


async function loadProducts(){

    const response=await fetch(`${API_URL}/user-products/my`,{

        headers:{
            "Authorization":"Bearer "+token
        }

    });

    const products=await response.json();

    const div=document.getElementById("products");

    div.innerHTML="";

    products.forEach(product=>{

        div.innerHTML+=`

        <div class="card">

<div class="card">

    <h3>${product.name}</h3>

    <p>${product.description}</p>

    <p>
        Price :
        $${product.price}
    </p>

    <p>
        Quantity :
        ${product.quantity}
    </p>

</div>
            <p>

                Quantity :

                ${product.quantity}

            </p>

        </div>

        `;

    });

}


function logout(){

    localStorage.removeItem("token");

    window.location="test-auth.html";

}

loadProducts();

</script>

</body>
</html>
